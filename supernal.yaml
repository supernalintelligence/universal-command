# Supernal Configuration for @supernal/universal-command
# This package demonstrates the Supernal workflow system

version: '1.0'
package:
  name: '@supernal/universal-command'
  type: standalone
  license: MIT

# Reference to parent monorepo (for full requirement context)
upstream:
  repo: https://github.com/supernalintelligence/supernal-coding
  docs_path: docs/architecture/decisions/2026-01-09-unified-cli-api-mcp-abstraction.md

# Local requirements (self-contained in this package)
requirements:
  prefix: REQ-UC
  path: .supernal/requirements

# Test configuration
testing:
  framework: vitest
  path: src/**/*.test.ts
  requirement_linkage: true

# Git hooks
git_hooks:
  pre_commit:
    checks:
      lint_staged:
        enabled: true
      type_check:
        enabled: true
      test_suite:
        enabled: true
        block_on_failures: true

# Features enabled
features:
  requirement_tracking: true
  test_traceability: true
  commit_traceability: true

director:
  enabled: true
  schedule_profile: frequent
  dry_run: false
  max_workers: 2
  surfaces:
    local: true
    github: false
    vercel: false
    supabase: false
    ci: false
  queue:
    depth_limit: 50
    backpressure_high: 30
    backpressure_low: 20
  rate_limits:
    github: 5000
    vercel: 100
    supabase: 200
  autofix:
    max_open_prs: 3
    max_open_prs_per_submodule: 1
    pr_check_command: gh pr list
  cost_budgets:
    local:
      daily_compute_ms: 300000
    github:
      daily_usd: 0.50
    global:
      daily_usd: 2.00

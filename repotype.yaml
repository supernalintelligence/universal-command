# repotype.yaml for universal-command
# Run: pnpm run repo:lint   (repotype validate .)
# Keeps the repository tidy: a fixed root layout, no build output or internal
# files committed, and the documents a published package needs.
version: '1'

defaults:
  unmatchedFiles: deny

ignore:
  - node_modules/**
  - dist/**
  - .turbo/**
  - '*.tsbuildinfo'
  - coverage/**

folders:
  - id: package-root
    path: .
    requiredFiles:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - package.json
    requiredFolders:
      - src
      - docs
    allowedFolders:
      - src
      - docs
      - examples
      - scripts
      - .git
      - .github
      - .husky
      - .supernal

files:
  - id: root-configs
    glob: '*.{json,yaml,yml,ts,js}'

  - id: root-docs
    glob: '{README,CHANGELOG,CONTRIBUTING,CLAUDE}.md'

  - id: license-file
    glob: LICENSE

  - id: root-dotfiles
    glob: '.{gitignore,mailmap,prettierrc}'

  - id: pnpm-lock
    glob: pnpm-lock.yaml

  - id: source-files
    glob: 'src/**/*'
    lint:
      allowOverbroad: true
      reason: 'Source tree is recursive by design.'

  - id: doc-files
    glob: 'docs/**/*'
    lint:
      allowOverbroad: true
      reason: 'Documentation tree is recursive by design.'

  - id: example-files
    glob: 'examples/**/*'
    lint:
      allowOverbroad: true
      reason: 'Examples are recursive by design.'

  - id: script-files
    glob: 'scripts/**/*'
    lint:
      allowOverbroad: true
      reason: 'Helper scripts.'

  - id: github-files
    glob: '.github/**/*'
    lint:
      allowOverbroad: true
      reason: 'Workflows and templates.'

  - id: husky-files
    glob: '.husky/**/*'
    lint:
      allowOverbroad: true
      reason: 'Git hooks.'

  - id: supernal-files
    glob: '.supernal/**/*'
    lint:
      allowOverbroad: true
      reason: 'Requirement records.'
